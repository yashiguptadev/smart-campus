{% extends "base.html" %}
{% block title %}{{ 'Edit' if resource else 'Add' }} resource · Smart Campus Resource Optimizer{% endblock %}

{% block content %}
<a class="back-link" href="{{ url_for('admin.resources') }}">&larr; All resources</a>
<h1 class="page-title mt-2 mb-4">{{ 'Edit ' ~ resource.name if resource else 'Add a resource' }}</h1>

<form method="post" class="form-narrow" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label" for="name">Name</label>
    <input class="form-control" id="name" name="name" value="{{ data.name }}" maxlength="120" required autofocus>
  </div>
  <div class="mb-3">
    <label class="form-label" for="type">Type</label>
    <input class="form-control" id="type" name="type" value="{{ data.type }}" list="type-options" maxlength="50" required>
    <datalist id="type-options"><option value="lab"><option value="hall"><option value="room"><option value="equipment"></datalist>
  </div>
  <div class="mb-3">
    <label class="form-label" for="location">Location</label>
    <input class="form-control" id="location" name="location" value="{{ data.location }}" maxlength="120">
  </div>
  <div class="row g-3 mb-4">
    <div class="col">
      <label class="form-label" for="capacity">Capacity</label>
      <input class="form-control" type="number" min="1" id="capacity" name="capacity" value="{{ data.capacity }}" required>
    </div>
    <div class="col">
      <label class="form-label" for="status">Status</label>
      <select class="form-select" id="status" name="status">
        {% for s in statuses %}<option value="{{ s }}" {{ 'selected' if s == data.status }}>{{ s|replace('_', ' ')|capitalize }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <button class="btn btn-primary" type="submit">{{ 'Save changes' if resource else 'Add resource' }}</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('admin.resources') }}">Cancel</a>
</form>
{% endblock %}
