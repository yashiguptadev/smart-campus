{% extends "base.html" %}
{% block title %}Create account · Smart Campus Resource Optimizer{% endblock %}

{% block shell %}
<div class="auth auth-single">
  <section class="auth-main">
    <div class="auth-form">
      <h2>Create an account</h2>
      {% include "_flash.html" %}
      <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="name">Full name</label>
          <input class="form-control" id="name" name="name" autocomplete="name" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="role">I am a</label>
          <select class="form-select" id="role" name="role">
            <option value="student">Student</option>
            <option value="faculty">Faculty member</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
          <div class="form-text">At least 8 characters.</div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="confirm">Confirm password</label>
          <input class="form-control" type="password" id="confirm" name="confirm" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Create account</button>
      </form>
      <p class="auth-alt">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </div>
  </section>
</div>
{% endblock %}
