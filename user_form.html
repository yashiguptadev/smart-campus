{% extends "base.html" %}
{% block title %}Add user · Smart Campus Resource Optimizer{% endblock %}

{% block content %}
<a class="back-link" href="{{ url_for('admin.users') }}">&larr; All users</a>
<h1 class="page-title mt-2 mb-4">Add a user</h1>

<form method="post" class="form-narrow" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label" for="name">Full name</label>
    <input class="form-control" id="name" name="name" value="{{ data.name }}" required autofocus>
  </div>
  <div class="mb-3">
    <label class="form-label" for="email">Email</label>
    <input class="form-control" type="email" id="email" name="email" value="{{ data.email }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="role">Role</label>
    <select class="form-select" id="role" name="role">
      {% for r in roles %}<option value="{{ r }}" {{ 'selected' if r == data.role }}>{{ labels[r] }}</option>{% endfor %}
    </select>
  </div>
  <div class="mb-4">
    <label class="form-label" for="password">Temporary password</label>
    <input class="form-control" type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
    <div class="form-text">At least 8 characters. Share it with the user directly.</div>
  </div>
  <button class="btn btn-primary" type="submit">Create account</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('admin.users') }}">Cancel</a>
</form>
{% endblock %}
